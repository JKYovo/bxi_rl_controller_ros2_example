schema: 1
id: com.bxi.ballet
name: 张杰 shen V3
version: 1.0.0
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: protected
requires:
  - id: com.bxi.basic_actions
    version: ">=1,<2"
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros: []
  system: []

events:
  activate:
    slot: btn_10
    value: 3
  toggle_pause:
    slot: btn_9
    value: 1
states:
  ballet:
    manifest:
      label: 张杰 shen V3
      priority: 890
      group: Advanced
      icon: wand_stars
      confirm: true
      confirm_message: 请确保机器人周围5米范围内没有障碍物
routes:
  - from: com.bxi.basic_actions/normal
    event: activate
    to: ballet
    transition:
      profile: dual_running_blend
      duration: 1.0
  - from: ballet
    event: com.bxi.basic_actions/normal
    to: com.bxi.basic_actions/normal
    transition:
      profile: dual_running_blend
      duration: 1.0
actions:
  - from: ballet
    event: toggle_pause
    action: toggle_pause
    manifest:
      label: 暂停/继续
      ui: pause
