schema: 1
id: com.bxi.side_flip
name: 侧空翻
version: 1.0.0
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: protected
requires:
  - id: com.bxi.basic_actions
    version: ">=1,<2"
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros: []
  system: []

events:
  activate:
    slot: btn_10
    value: 3
states:
  side_flip:
    manifest:
      label: 侧空翻
      priority: 905
      group: Advanced
      icon: rotate_left
      confirm: true
      confirm_message: 请确保机器人侧方3米范围内没有障碍物
routes:
  - from: com.bxi.basic_actions/normal
    event: activate
    to: side_flip
    transition: dual_running_blend
  - from: side_flip
    event: com.bxi.basic_actions/zero_torque
    to: com.bxi.basic_actions/zero_torque
